# ===============================
# Application Info
# ===============================
spring.application.name=demo
server.port=9001

# Needed when running behind preview / proxy
server.forward-headers-strategy=framework


# ===============================
# Database Configuration (MariaDB / MySQL)
# ===============================
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/credentials
spring.datasource.username=root
spring.datasource.password=Amypo
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html


# ===============================
# Security / JWT (used by JwtUtil)
# ===============================
jwt.secret=MySuperSecretKeyForJwtGeneration123456
jwt.expiration=3600000


# ===============================
# Logging (Helpful for Debugging)
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
